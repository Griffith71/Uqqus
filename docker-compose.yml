# LOCAL DEVELOPMENT ONLY. This stack turns on test switches (MEDIA_DEV_PROVIDER, FEED_SERVER_ALLOW_LOCAL, plain
# HTTP with FORCE_HTTPS=0, FLASK_DEBUG) that must never reach a live site: they disable the SSRF guard on feed
# servers, add a fake media provider and make the session cookie non-Secure.
services:
  ruqqus:
    build:
      context: .
    environment:
      - domain=localhost
      - REDIS_URL=redis://redis
      - DATABASE_URL=postgresql://postgres@postgres:5432/postgres
      - DATABASE_CONNECTION_POOL_URL=postgresql://postgres@postgres:5432/postgres
      - MASTER_KEY=${MASTER_KEY:?run python scripts/gen_dev_env.py}
      - FLASK_DEBUG=1
      - FLASK_ENV=development
      - FORCE_HTTPS=0
      # stand-in media storage for local testing only (ruqqus/helpers/media/dev.py)
      - MEDIA_DEV_PROVIDER=${MEDIA_DEV_PROVIDER:-1}
      - MEDIA_DEV_DIR=/var/lib/ruqqus-media-dev
      # linked media storage with Google (ruqqus/helpers/media/google_oauth.py): put these in .env
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT=${MICROSOFT_TENANT:-}
      - DAILYMOTION_API_KEY=${DAILYMOTION_API_KEY:-}
      - DAILYMOTION_API_SECRET=${DAILYMOTION_API_SECRET:-}
      # trending topics (ruqqus/helpers/trending.py): accounts a topic needs
      - TRENDING_MIN_AUTHORS=${TRENDING_MIN_AUTHORS:-3}
      # outside feed servers for curations (ruqqus/helpers/feed_server.py). ALLOW_LOCAL lets a
      # test server on this machine be used: local testing only, never on a live site
      - FEED_SERVERS_ENABLED=${FEED_SERVERS_ENABLED:-1}
      - FEED_SERVER_ALLOW_LOCAL=${FEED_SERVER_ALLOW_LOCAL:-1}
      - BOTS_ENABLED=${BOTS_ENABLED:-1}
      # chat for a member whose Matrix account Synapse already holds with no record on the site (routes/chat.py,
      # audit D-07): off, so a database restored without Synapse's never hands a new member an old account. Turn it on
      # only when the two belong together (e.g. a dev database restored on its own, with test accounts)
      - MATRIX_ADOPT_EXISTING=${MATRIX_ADOPT_EXISTING:-0}
      # the client's address (ruqqus/helpers/client_address.py): proxies in front of the app, none locally
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-0}
      - TRUST_CF_CONNECTING_IP=${TRUST_CF_CONNECTING_IP:-0}
      # the creator fund (ruqqus/helpers/creator_fund.py): points a member needs to share a month (default 50, never under 10)
      - CREATOR_FUND_MIN_POINTS=${CREATOR_FUND_MIN_POINTS:-}
      # Google AdSense (ruqqus/helpers/ads.py): empty = no ads. Put real ids in .env
      - ADSENSE_CLIENT=${ADSENSE_CLIENT:-}
      - ADSENSE_SLOT_FEED=${ADSENSE_SLOT_FEED:-}
      - ADSENSE_SLOT_POST=${ADSENSE_SLOT_POST:-}
      - ADSENSE_SLOT_SIDEBAR=${ADSENSE_SLOT_SIDEBAR:-}
      - ADSENSE_FEED_LAYOUT_KEY=${ADSENSE_FEED_LAYOUT_KEY:-}

      - HCAPTCHA_SECRET=5436ertfgcvbnfgcy
      - CLOUDFLARE_KEY=5436ertfgcvbnfgcy
      - AWS_ACCESS_KEY_ID=5436ertfgcvbnfgcy
      - AWS_SECRET_ACCESS_KEY=5436ertfgcvbnfgcy
      - DISCORD_BOT_TOKEN=5436ertfgcvbnfgcy
      - GIPHY_KEY=5436ertfgcvbnfgcy
      - TENOR_KEY=5436ertfgcvbnfgcy
      - MAILGUN_KEY=5436ertfgcvbnfgcy
      - CLOUDFLARE_ZONE=5436ertfgcvbnfgcy

      - MATRIX_INTERNAL_URL=${MATRIX_INTERNAL_URL:-http://synapse:8008}
      - MATRIX_PUBLIC_URL=${MATRIX_PUBLIC_URL:-http://localhost:8008}
      - MATRIX_SERVER_NAME=${MATRIX_SERVER_NAME:-ruqqus.local}
      - MATRIX_AS_TOKEN=${MATRIX_AS_TOKEN:?run python scripts/gen_dev_env.py}
      - MATRIX_HS_TOKEN=${MATRIX_HS_TOKEN:?run python scripts/gen_dev_env.py}
      - MATRIX_USER_PREFIX=${MATRIX_USER_PREFIX:-ruqqus_}
      # the call relay's own counters (scripts/turn_usage.py) and its monthly allowance (helpers/turn_usage.py)
      - TURN_METRICS_URL=${TURN_METRICS_URL:-http://coturn:9641/metrics}
      - TURN_MONTHLY_GB=${TURN_MONTHLY_GB:-50}
      # whether a linked stream is live (ruqqus/helpers/livestream_status.py): optional, put them in .env
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
    volumes:
      # the stand-in media storage, kept across rebuilds so test pictures do not vanish
      - "media-dev:/var/lib/ruqqus-media-dev"
    links:
      - "redis"
      - "postgres"
      - "synapse"
    ports:
      - "80:80"
    depends_on:
      - redis
      - postgres
      - synapse
    restart: unless-stopped
    # readiness, unlike the image's own liveness check: the database and Redis must answer (routes/health.py)
    healthcheck:
      test: ["CMD", "/opt/ruqqus/service/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/readyz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  synapse:
    image: matrixdotorg/synapse:v1.162.0
    entrypoint: ["sh", "-c"]
    command:
      - >
        python -m synapse.app.homeserver --generate-keys -c /data/homeserver.yaml &&
        exec python -m synapse.app.homeserver -c /data/homeserver.yaml
    volumes:
      - "./synapse/homeserver.yaml:/data/homeserver.yaml"
      - "./synapse/ruqqus-appservice.yaml:/data/ruqqus-appservice.yaml"
      - "./synapse/turn_shared_secret:/data/turn_shared_secret:ro"
      - "synapse-signing-key:/data/keys"
      - "synapse-media:/data/media_store"
    ports:
      - "8008:8008"
    depends_on:
      - postgres_synapse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8008/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # the relay calls and Spaces send their media through (coturn/turnserver.conf.template, rendered by
  # scripts/gen_dev_env.py). Only the client port is published: two members' relayed connections meet inside this
  # container, so the relay ports and the metrics port (read by the ruqqus service) stay on the compose network.
  coturn:
    image: coturn/coturn:4.7.0
    entrypoint: ["sh", "-c"]
    command:
      - >
        test -f /etc/coturn/turnserver.conf || { echo "coturn/turnserver.conf is missing: run python scripts/gen_dev_env.py" >&2; exit 1; } &&
        exec turnserver -c /etc/coturn/turnserver.conf
        --relay-ip=$$(hostname -i) --allowed-peer-ip=$$(hostname -i)
    volumes:
      - "./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    restart: unless-stopped

  postgres_synapse:
    image: postgres:15
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
    environment:
      - POSTGRES_USER=synapse
      - POSTGRES_PASSWORD=synapse
      - POSTGRES_DB=synapse
      - POSTGRES_INITDB_ARGS=--locale=C --encoding=UTF8
    volumes:
      - "postgres-synapse-data:/var/lib/postgresql/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    volumes:
      - ./redis.conf:/ruqqus/redis.conf
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # A daily dump of the site's database and Synapse's, as a pair, into the `backups` volume (scripts/backup_loop.sh).
  # The postgres:15 client reads both servers. Restore: scripts/restore.sh; the restore drill: scripts/verify_backup.sh;
  # what it does NOT cover (a copy off this machine, the media volumes): RESTORE.md.
  backup:
    image: postgres:15
    entrypoint: ["bash", "/backup_loop.sh"]
    volumes:
      - "./scripts/backup_loop.sh:/backup_loop.sh:ro"
      - "backups:/backups"
    depends_on:
      - postgres
      - postgres_synapse
    restart: unless-stopped
    healthcheck:
      # healthy while a backup succeeded within the last 26 hours (the interval plus two of slack) and the latest
      # try did not fail (last_failure is removed by the next success)
      test: ["CMD-SHELL", "test -n \"$$(find /backups/last_success -mmin -1560 2>/dev/null)\" && ! test -e /backups/last_failure"]
      interval: 30m
      timeout: 10s
      retries: 1
      start_period: 15m

  postgres:
    image: postgres:12.3
    volumes:
      - "./schema.sql:/docker-entrypoint-initdb.d/00-schema.sql"
      - "./seed-db.sql:/docker-entrypoint-initdb.d/10-seed-db.sql"
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  backups:
  media-dev:
  synapse-media:
  synapse-signing-key:
  postgres-synapse-data:
