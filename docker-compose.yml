services:
  ruqqus:
    build:
      context: .
    environment:
      - domain=localhost
      - REDIS_URL=redis://redis
      - DATABASE_URL=postgresql://postgres@postgres:5432/postgres
      - DATABASE_CONNECTION_POOL_URL=postgresql://postgres@postgres:5432/postgres
      - MASTER_KEY=${MASTER_KEY:?run python scripts/gen_dev_env.py}
      - SESSION_COOKIE_SECURE=false
      - FLASK_DEBUG=1
      - FLASK_ENV=development
      - FORCE_HTTPS=0
      # stand-in media storage for local testing only (ruqqus/helpers/media/dev.py)
      - MEDIA_DEV_PROVIDER=${MEDIA_DEV_PROVIDER:-1}
      - MEDIA_DEV_DIR=/var/lib/ruqqus-media-dev
      # linked media storage with Google (ruqqus/helpers/media/google_oauth.py): put these in .env
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # trending topics (ruqqus/helpers/trending.py): accounts a topic needs
      - TRENDING_MIN_AUTHORS=${TRENDING_MIN_AUTHORS:-3}
      # outside feed servers for curations (ruqqus/helpers/feed_server.py). ALLOW_LOCAL lets a
      # test server on this machine be used: local testing only, never on a live site
      - FEED_SERVERS_ENABLED=${FEED_SERVERS_ENABLED:-1}
      - FEED_SERVER_ALLOW_LOCAL=${FEED_SERVER_ALLOW_LOCAL:-1}

      - HCAPTCHA_SECRET=5436ertfgcvbnfgcy
      - CLOUDFLARE_KEY=5436ertfgcvbnfgcy
      - AWS_ACCESS_KEY_ID=5436ertfgcvbnfgcy
      - AWS_SECRET_ACCESS_KEY=5436ertfgcvbnfgcy
      - DISCORD_BOT_TOKEN=5436ertfgcvbnfgcy
      - GIPHY_KEY=5436ertfgcvbnfgcy
      - TENOR_KEY=5436ertfgcvbnfgcy
      - MAILGUN_KEY=5436ertfgcvbnfgcy
      - CLOUDFLARE_ZONE=5436ertfgcvbnfgcy

      - MATRIX_INTERNAL_URL=${MATRIX_INTERNAL_URL:-http://synapse:8008}
      - MATRIX_PUBLIC_URL=${MATRIX_PUBLIC_URL:-http://localhost:8008}
      - MATRIX_SERVER_NAME=${MATRIX_SERVER_NAME:-ruqqus.local}
      - MATRIX_AS_TOKEN=${MATRIX_AS_TOKEN:?run python scripts/gen_dev_env.py}
      - MATRIX_HS_TOKEN=${MATRIX_HS_TOKEN:?run python scripts/gen_dev_env.py}
      - MATRIX_USER_PREFIX=${MATRIX_USER_PREFIX:-ruqqus_}
    volumes:
      # the stand-in media storage, kept across rebuilds so test pictures do not vanish
      - "media-dev:/var/lib/ruqqus-media-dev"
    links:
      - "redis"
      - "postgres"
      - "synapse"
    ports:
      - "80:80"
    depends_on:
      - redis
      - postgres
      - synapse

  synapse:
    image: matrixdotorg/synapse:latest
    entrypoint: ["sh", "-c"]
    command:
      - >
        python -m synapse.app.homeserver --generate-keys -c /data/homeserver.yaml &&
        exec python -m synapse.app.homeserver -c /data/homeserver.yaml
    volumes:
      - "./synapse/homeserver.yaml:/data/homeserver.yaml"
      - "./synapse/ruqqus-appservice.yaml:/data/ruqqus-appservice.yaml"
      - "synapse-signing-key:/data/keys"
      - "synapse-media:/data/media_store"
    ports:
      - "8008:8008"
    depends_on:
      - postgres_synapse

  postgres_synapse:
    image: postgres:15
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
    environment:
      - POSTGRES_USER=synapse
      - POSTGRES_PASSWORD=synapse
      - POSTGRES_DB=synapse
      - POSTGRES_INITDB_ARGS=--locale=C --encoding=UTF8
    volumes:
      - "postgres-synapse-data:/var/lib/postgresql/data"

  redis:
    image: redis
    volumes:
      - ./redis.conf:/ruqqus/redis.conf
    ports:
      - "6379:6379"

  postgres:
    image: postgres:12.3
    volumes:
      - "./schema.sql:/docker-entrypoint-initdb.d/00-schema.sql"
      - "./seed-db.sql:/docker-entrypoint-initdb.d/10-seed-db.sql"
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"

volumes:
  media-dev:
  synapse-media:
  synapse-signing-key:
  postgres-synapse-data:
