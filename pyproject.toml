# Tooling config only - the legacy Flask app is not packaged from here.
[tool.ruff]
target-version = "py311"
extend-exclude = ["graphify-out", "web", "ruqqus/assets"]

[tool.ruff.lint]
# Errors only (syntax errors, undefined names, invalid comparisons/format strings).
# Style rules are deliberately off: the legacy code base is not being reformatted.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
