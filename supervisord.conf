[program:ruqqusturn]
; counts what the call relay (coturn) sends against TURN_MONTHLY_GB, every 5 minutes (scripts/turn_usage.py);
; calls pause on cost when it stops, so it must keep running
directory=/opt/ruqqus/service
command=/opt/ruqqus/service/venv/bin/python scripts/turn_usage.py
environment=PYTHONPATH="/opt/ruqqus/service"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ruqqusbroadcasts]
; takes people out of broadcast channels for circles once they are no longer in them, hourly (scripts/sync_broadcasts.py)
directory=/opt/ruqqus/service
command=/opt/ruqqus/service/venv/bin/python scripts/sync_broadcasts.py
environment=PYTHONPATH="/opt/ruqqus/service"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
