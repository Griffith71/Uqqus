# Synapse homeserver config for Ruqqus's Chat feature. This homeserver
# exists purely as the messaging backend behind Chat - every account on
# it is a Ruqqus website user provisioned via the Application Service
# registered below (see ruqqus-appservice.yaml), never a human signing up
# directly. Federation is intentionally disabled: there is never a
# legitimate reason for a Ruqqus-internal conversation to talk to another
# homeserver, so no federation listener/port is configured at all.

server_name: "ruqqus.local"
pid_file: /data/homeserver.pid
public_baseurl: "http://localhost:8008/"

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client]
        compress: false

# No `federation` resource/listener above, and an empty whitelist as a
# second layer - this homeserver never federates.
federation_domain_whitelist: []

database:
  name: psycopg2
  args:
    user: synapse
    password: synapse
    database: synapse
    host: postgres_synapse
    port: 5432
    cp_min: 5
    cp_max: 10

media_store_path: /data/media_store

# Only the Application Service can create accounts - see
# ruqqus-appservice.yaml's exclusive @ruqqus_* namespace. No human ever
# registers directly against this homeserver.
enable_registration: false
registration_requires_token: false

app_service_config_files:
  - /data/ruqqus-appservice.yaml

# The site's rules, held by the homeserver (synapse/modules/uqqus_rules.py, mounted at /modules): only the site's bot
# makes rooms, invites, makes room addresses and sends room state; nobody publishes a room or uploads to the media
# store; a member joins only a room they were invited to. An outside Matrix app talks to this server directly, so the
# rules the site's routes apply must hold here too.
modules:
  - module: uqqus_rules.UqqusRules
    config:
      bot_localpart: ruqqus_bot
      user_prefix: ruqqus_

# Nobody can look people up here: the site's own people search (with its block and word-filter rules) is the only way
# to find someone, and a profile is only readable by people who share a room with it.
user_directory:
  enabled: false
require_auth_for_profile_requests: true
limit_profile_requests_to_users_who_share_rooms: true

# Names and pictures are the site's: an outside app can't change a member's chat name (it could pass for someone else).
enable_set_displayname: false
enable_set_avatar_url: false
enable_3pid_changes: false

# "Sign in with <site>" in outside Matrix apps (Element Web and Desktop, FluffyChat, Cinny...): the site is the only
# way in (ruqqus/routes/oidc_pages.py, helpers/oidc_provider.py). Synapse makes nobody new here (`enable_registration`):
# a sign-in lands on the Matrix account the site already made for that member (`allow_existing_users`, the id from the
# site's account number), and only once the member has opened Chat on the site, so their keys exist. Password sign-in is
# off (nobody has a Matrix password); the site's own chat page signs in through the appservice, which this leaves alone.
# Endpoints the browser opens use the site's public address; those Synapse calls itself use the compose network.
# On a live site: issuer and authorization_endpoint are https://<site>, the rest stay internal, and skip_verification
# is removed (it only allows the http issuer of local development).
password_config:
  enabled: false
oidc_providers:
  - idp_id: site
    idp_name: "Laba"
    discover: false
    issuer: "http://localhost"
    client_id: synapse
    client_secret_path: /data/oidc_client_secret
    client_auth_method: client_secret_post
    pkce_method: always
    scopes: ["openid"]
    authorization_endpoint: "http://localhost/oidc/authorize"
    token_endpoint: "http://ruqqus/oidc/token"
    userinfo_endpoint: "http://ruqqus/oidc/userinfo"
    jwks_uri: "http://ruqqus/oidc/jwks"
    skip_verification: true
    allow_existing_users: true
    enable_registration: false
    user_mapping_provider:
      config:
        subject_claim: sub
        localpart_template: "ruqqus_{{ user.sub }}"

signing_key_path: /data/keys/homeserver.signing.key

trusted_key_servers: []

report_stats: false

# Calls and Spaces send all their audio and video through the relay (coturn,
# docker-compose.yml): browsers ask this server for short-lived relay
# credentials (/voip/turnServer), made from a secret coturn shares. The secret
# is a file written by scripts/gen_dev_env.py, never in git. On a live site the
# addresses are turn.<site> (DNS-only, not behind Cloudflare), with a
# `turns:turn.<site>:5349?transport=tcp` for networks that only let TLS out.
turn_uris:
  - "turn:localhost:3478?transport=udp"
  - "turn:localhost:3478?transport=tcp"
turn_shared_secret_path: /data/turn_shared_secret
turn_user_lifetime: 1h
turn_allow_guests: false

# Rooms are 1:1 only - these are default Matrix content-repo/history
# limits, left at their sane defaults, not tuned here.
