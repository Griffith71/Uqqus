<!-- Delete Comment Modal -->
<div class="modal fade" id="deleteCommentModal" tabindex="-1" role="dialog" aria-labelledby="deleteCommentModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ _("Delete comment?") }}</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="{{ _('Close') }}">
          <span aria-hidden="true"><i class="fas fa-times"></i></span>
        </button>
      </div>
      
      <div class="modal-body text-center">

        <div class="py-4">
          <i class="fas fa-trash-alt text-muted" style="font-size: 3.5rem;"></i>
        </div>

        <p>{{ _('Your comment will be taken off the site\'s pages. Its text stays readable in the public <a href="%(url)s">Deletion log</a>. This can\'t be undone.', url="/log/deleted") }}</p>
      </div>
      
      <div class="modal-footer">
        <button type="button" class="btn btn-link text-muted" data-dismiss="modal">{{ _("Cancel") }}</button>
        <button id="deleteCommentButton" class="btn btn-danger">{{ _("Delete comment") }}</button>
      </div>
      
    </div>
  </div>
</div>
