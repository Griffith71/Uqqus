<!-- Forward Post Modal -->
<div class="modal fade" id="forwardPostModal" tabindex="-1" role="dialog" aria-labelledby="forwardPostModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Forward this post</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true"><i class="far fa-times"></i></span>
        </button>
      </div>
      <div id="forwardPostFormBefore">
        <form id="forward-post-form" method="post">
          <div class="modal-body">
            <div class="h6">Forward to a guild for community discussion</div>
            <small class="form-text text-muted">This creates an independent copy of the post with its own votes and comments in that guild. You can forward to any guild that accepts forwards from you.</small>
            <input type="hidden" name="formkey" value="{{ v.formkey }}">
            <input class="form-control mt-3" id="forward-guild-name" type="text" placeholder="Guild name (without +)" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('forwardPostButton').click();}">
          </div>
          <div id="forwardPostError" class="text-danger px-3 pb-2 d-none small"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-link text-muted" data-dismiss="modal">Cancel</button>
            <button type="button" id="forwardPostButton" class="btn btn-primary">Forward</button>
          </div>
        </form>
      </div>
      <div class="d-none" id="forwardPostFormAfter">
        <div class="modal-body">
          <div class="h6">Forwarded!</div>
          <small class="form-text text-muted">Reloading...</small>
        </div>
      </div>
    </div>
  </div>
</div>
