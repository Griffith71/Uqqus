<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Sign in to {{ 'SITE_NAME' | app_config }}">
    <meta name="author" content="">

    <title>2-Step Login - {{ 'SITE_NAME' | app_config }}</title>

    <!-- Bootstrap core CSS -->

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- the icons, as default.html loads them -->


    <!-- Ruqqus CSS -->
    <link rel="stylesheet" href="{{ asset_url('style/main.css') }}">

</head>

<body id="login">

    <!-- Navigation -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent fixed-top border-0">
        <div class="container-fluid">
            <button class="navbar-toggler d-none" type="button" data-toggle="collapse" data-target="#navbarResponsive"
            aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/help/about">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/help/terms">Terms</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="mailto:info@ruqqus.com">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Page Content -->

<div class="container-fluid position-absolute h-100 p-0 overflow-auto">
    <div class="row no-gutters h-100">

        <div class="col-12 col-md-6 my-auto p-3">

            <div class="row justify-content-center">

                <div class="col-10 col-md-7">

                    <div class="mb-5">
                        <a href="/" class="text-decoration-none"><span class="h3 text-primary">ruqqus</span></a>
                    </div>


                        <h1 class="h2">Premium Required</h1>

                        <p class="text-muted mb-md-5">Development server access is a {{ 'SITE_NAME' | app_config }} Premium benefit.</p>

                        <a href="https://ruqqus.com/settings/premium" class="btn btn-primary">Get Premium</a>


            </div>

        </div>

    </div>

    <div class="col-12 col-md-6 d-none d-md-block">

        <div class="splash-wrapper">

            <div class="splash-overlay"></div>

            <h6 class="splash-text">
                {{ i.text }}
            </h6>

            <img class="splash-img" src="{{ i.path }}"></img>
        </div>

    </div>

</div>
</div>
