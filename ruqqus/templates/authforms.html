<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{% block pagedesc %}{{ 'SITE_NAME' | app_config }} - the free speech social platform{% endblock %}">
    <meta name="author" content="">

    <title>{% block pagetitle %}{{ 'SITE_NAME' | app_config }} - the open, free-speech social platform{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600&display=swap" rel="stylesheet">

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- the icons, as default.html loads them -->


    <!-- Ruqqus CSS -->
    <link rel="stylesheet" href="{{ asset_url('style/main.css') }}">

</head>

<body id="login">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent fixed-top border-0">
        <div class="container-fluid">
            <button class="navbar-toggler d-none" type="button" data-toggle="collapse" data-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/help/about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/help/terms">Terms</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="mailto:info@ruqqus.com">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Content -->

    <div class="container-fluid position-absolute h-100 p-0">
        <div class="row no-gutters h-100">

            <div class="col-12 col-md-6 my-auto p-3">

                <div class="row justify-content-center">

                    <div class="col-10 col-md-7">

                    <div class="mb-5">
                        <a href="/" class="text-decoration-none"><span class="h3 text-primary">ruqqus</span></a>
                    </div>

                    <h1 class="h2">{% block authtitle %}{% endblock %}</h1>

                    <p class="text-muted mb-md-5">{% block authtext %}{% endblock %}</p>

			{% if error %}
				<div class="alert alert-danger alert-dismissible fade show d-flex my-3" role="alert">
                          <i class="fas fa-exclamation-circle my-auto"></i>
                          <span>
                          {{ error }}
                          </span>
                          <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true"><i class="fas fa-times"></i></span>
                        </button>
                </div>
			{% endif %}
			{% if msg %}
				<div class="alert alert-success alert-dismissible fade show d-flex my-3" role="alert">
                          <i class="fas fa-info-circle my-auto" aria-hidden="true"></i>
                          <span>
                          {{ msg }}
                          </span>
                          <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true"><i class="fas fa-times"></i></span>
                        </button>
                </div>
			{% endif %}

                        {% block content %}
			{% endblock %}

                    </div>

                </div>

            </div>

            <div class="col-12 col-md-6 d-none d-md-block">

                <div class="splash-wrapper">

                    <div class="splash-overlay"></div>

                    <h6 class="splash-text">
                        {{ i.text }}
                    </h6>

                    <img class="splash-img" src="{{ i.path }}"></img>
                </div>

            </div>

        </div>
    </div>

    <!-- Bootstrap core JavaScript -->
    {% include "bootstrap.html" %}


</body>

</html>
