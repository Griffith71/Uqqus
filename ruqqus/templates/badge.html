{% if b.url %}
<a href="{{ b.url }}"><img style="width: 32px; height: 32px" src="{{ b.path }}" data-toggle="tooltip" data-placement="bottom" title="" data-original-title="{{ msg_text(b.name) }} - {{ msg_text(b.text) }}"></a>
{% else %}
<img style="width: 32px; height: 32px" src="{{ b.path }}" data-toggle="tooltip" data-placement="bottom" title="" data-original-title="{{ msg_text(b.name) }} - {{ msg_text(b.text) }}">
{% endif %}
